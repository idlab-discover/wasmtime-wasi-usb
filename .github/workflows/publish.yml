name: Version and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v49.0.2)"
        required: true
        type: string

permissions:
  contents: write # Required to push version bumps, tags and create releases
  id-token: write # Required for crates.io Trusted Publishing (OIDC)

jobs:
  publish:
    name: Bump, Tag, Publish, and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Set Version
        id: bump
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Error: '$INPUT_VERSION' is not a valid semver version (expected e.g., v49.0.2)."
            exit 1
          fi

          CRATE_VERSION=$(cargo read-manifest | jq -r .version)
          echo "Release version: $VERSION"
          echo "Crate version: $CRATE_VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV

          if [ "$VERSION" != "$CRATE_VERSION" ]; then
            echo "Bumping crate to $VERSION..."
            cargo set-version "$VERSION"
            cargo check
            echo "should_commit=true" >> $GITHUB_OUTPUT
          else
            echo "Crate version already matches requested version."
            echo "should_commit=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit Version Bump
        if: steps.bump.outputs.should_commit == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: bump version to ${{ env.VERSION }} [skip ci]"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

      - name: Tag Repository
        run: |
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # Allow re-running a failed publish, but never move an existing tag
            if [ "$(git rev-list -n 1 "$TAG")" != "$(git rev-parse HEAD)" ]; then
              echo "Error: Tag $TAG already exists on a different commit."
              exit 1
            fi
            echo "Tag $TAG already exists on HEAD. Proceeding."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$TAG" --verify-tag --generate-notes
