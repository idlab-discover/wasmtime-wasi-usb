name: Sync Version and Publish

on:
  workflow_dispatch:

permissions:
  contents: write # Required to push version bumps and tags
  id-token: write # Required for crates.io Trusted Publishing (OIDC)

jobs:
  publish:
    name: Bump, Tag, and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-edit

      - name: Check and Bump Version
        id: bump
        run: |
          WASM_VERSION=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name=="wasmtime") | .version')
          CRATE_VERSION=$(cargo read-manifest | jq -r .version)

          WASM_MAJOR=$(echo "$WASM_VERSION" | cut -d. -f1)
          CRATE_MAJOR=$(echo "$CRATE_VERSION" | cut -d. -f1)

          if [ -z "$WASM_MAJOR" ] || [ -z "$CRATE_MAJOR" ]; then
            echo "Error: Could not parse versions."
            exit 1
          fi

          echo "Wasmtime Major: $WASM_MAJOR"
          echo "Crate Major: $CRATE_MAJOR"

          if [ "$WASM_MAJOR" != "$CRATE_MAJOR" ]; then
            TARGET_VERSION="${WASM_MAJOR}.0.0"
            echo "Syncing major version. Bumping crate to $TARGET_VERSION..."
            
            # Update local files
            cargo set-version "$TARGET_VERSION"
            cargo check 
            
            echo "VERSION=$TARGET_VERSION" >> $GITHUB_ENV
            echo "should_commit=true" >> $GITHUB_OUTPUT
          else
            echo "Major versions match. Using current crate version ($CRATE_VERSION)."
            echo "VERSION=$CRATE_VERSION" >> $GITHUB_ENV
            echo "should_commit=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit Major Bump
        if: steps.bump.outputs.should_commit == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: sync major version to ${{ env.VERSION }} to match wasmtime [skip ci]"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

      - name: Tag Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only create the tag if it doesn't already exist
          if ! git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "Creating tag v${{ env.VERSION }}..."
            git tag "v${{ env.VERSION }}"
            git push origin "v${{ env.VERSION }}"
          else
            echo "Tag v${{ env.VERSION }} already exists. Proceeding to publish."
          fi

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
