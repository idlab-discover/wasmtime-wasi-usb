name: Sync Version and Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write # Required to push version bumps and tags
  id-token: write # Required for crates.io Trusted Publishing (OIDC)

jobs:
  auto-sync:
    name: Auto-Sync Major Version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Check Versions and Determine Action
        id: versioning
        run: |
          WASM_VERSION=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name=="wasmtime") | .version')
          CRATE_VERSION=$(cargo read-manifest | jq -r .version)

          WASM_MAJOR=$(echo "$WASM_VERSION" | cut -d. -f1)
          CRATE_MAJOR=$(echo "$CRATE_VERSION" | cut -d. -f1)

          if [ -z "$WASM_MAJOR" ] || [ -z "$CRATE_MAJOR" ]; then
            echo "Error: Could not parse versions."
            exit 1
          fi

          echo "Wasmtime Major: $WASM_MAJOR"
          echo "Crate Major: $CRATE_MAJOR"

          if [ "$WASM_MAJOR" != "$CRATE_MAJOR" ]; then
            TARGET_VERSION="${WASM_MAJOR}.0.0"
            echo "Major versions differ. Auto-syncing crate to $TARGET_VERSION..."
            
            # Update local files
            cargo set-version "$TARGET_VERSION"
            cargo check 
            
            echo "NEW_VERSION=$TARGET_VERSION" >> $GITHUB_ENV
            echo "should_sync=true" >> $GITHUB_OUTPUT
          else
            echo "Major versions match ($WASM_MAJOR). Leaving manual publishes to human tag pushes."
            echo "should_sync=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Tag Major Bump
        if: steps.versioning.outputs.should_sync == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync major version to ${{ env.NEW_VERSION }} to match wasmtime [skip ci]"
          tagging_message: "v${{ env.NEW_VERSION }}"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

      - name: Authenticate with crates.io (Auto)
        if: steps.versioning.outputs.should_sync == 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth_auto

      - name: Publish to crates.io (Auto)
        if: steps.versioning.outputs.should_sync == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_auto.outputs.token }}
        run: cargo publish

  manual-publish:
    name: Publish Manual Tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Authenticate with crates.io (Manual)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth_manual

      - name: Publish to crates.io (Manual)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_manual.outputs.token }}
        run: cargo publish
