[package]
name = "wasmtime-wasi-usb"
description = "Experimental USB library for WebAssembly in Wasmtime implementing wasi-usb"
version = "49.0.2"
edition = "2024"
authors = ["IDLab DISCOVER and contributors"]
repository = "https://github.com/idlab-discover/wasmtime-wasi-usb"
license = "MIT"

[dependencies]
wasmtime = "49.0.2"
wasmtime-wasi = "49.0.2"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
libusb1-sys = "0.7.0"
log = "0.4.33"
libc = "0.2.190"
once_cell = "1.21.4"
